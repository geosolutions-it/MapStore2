name: Update dependencies versions
# GeoStore and the HTTP proxy are built in this repository, at MapStore's version, so only
# MapFish Print remains an external dependency whose version is set here.
on:
  workflow_dispatch:
    inputs:
      mapfish-version:
        description: Mapfish print version to use (e.g. 2.4-SNAPSHOT)
        required: true
jobs:
  update-versions:
    name: Update dependency versions (Mapfish)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.main-branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Bot Details
        id: bot-details
        uses: raven-actions/bot-details@v1
        
      - name: Update versions
        id: create-versions
        env:
          BOT_ID: ${{ steps.bot-details.outputs.id }}
          BOT_DISPLAY_NAME: ${{ steps.bot-details.outputs.name }}
          BOT_EMAIL: ${{ steps.bot-details.outputs.email }}
          MAPFISH_GROUP: org.mapfish.print
          MAPFISH_VERSION: ${{ github.event.inputs.mapfish-version }}

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIN_BRANCH: ${{ github.event.inputs.main-branch }}
          PR_OPTIONS: ${{ github.event.inputs.pr-options }}
          RUN_ID: ${{ github.run_id }}

        run: |
          # script will go here
          echo "Initializing git"
          # Optional
          git config user.name $BOT_DISPLAY_NAME
          git config user.email $BOT_EMAIL
          echo "Updating the version of mapfish print in all pom.xml files to: $MAPFISH_VERSION"

          ## Update the version of the dependency in the project
          # updating in main `pom.xml` (the mvn property `print-lib.version` contains the version to update)
          mvn versions:set-property -Dproperty=print-lib.version -DnewVersion=$MAPFISH_VERSION -DgenerateBackupPoms=false -DautoVersionSubmodules=true -Pprinting
          git add pom.xml
          ## Update the version of the dependency in the project templates
          POM_FILES=$(git ls-files project/standard/templates/ | grep 'pom\.xml$')
          for POM_FILE in $POM_FILES; do
              mvn versions:set-property -f $POM_FILE -Dproperty=print-lib.version -DnewVersion=$MAPFISH_VERSION -DgenerateBackupPoms=false -DautoVersionSubmodules=true -Pprinting
          done
          pr_branch_name="up_versions-${RUN_ID}"
          echo "Creating a PR on branch: ${pr_branch_name} for ${{ github.ref_name }}"
          git checkout -b "${pr_branch_name}"
          echo $POM_FILES | xargs git add
          if ! git diff-index --quiet HEAD; then
            git commit -m "Set version of mapfish print"
          else
            echo "::notice::No version changes in dependencies to commit. Please make sure to make this version fixed later"
          fi
          git push origin "${pr_branch_name}"
          pr_url=$(gh pr create -B "${{ github.ref_name }}" -H "${pr_branch_name}" --title "[github-action] ${{ github.ref_name }} - Dependencies versions update" --body "This automatic pull request updates the version of mapfish print on ${{ github.ref_name }} branch to: $MAPFISH_VERSION")
          sleep 10
