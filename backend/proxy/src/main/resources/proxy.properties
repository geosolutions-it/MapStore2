# ##################
# CONNECTION MANAGER
# ##################
timeout = 30000
connection_timeout = 30000
max_total_connections = 60
default_max_connections_per_host = 6

# #################
# Stream Byte Size
# #################
defaultStreamByteSize=8192

# ###########
# WHITE LISTS
# ###########
#hostnameWhitelist = localhost,demo1.geo-solutions.it,demo.geo-solutions.it

# Non-public destinations are denied by default. Add only trusted internal services.
# Changes to the destination settings below take effect after a restart.
#allowedPrivateHosts = geoserver.intranet.local,10.0.5.20:8080
#allowedPrivateNetworks = 10.0.5.0/24
# Set to true to switch the destination checks off and reach non-public destinations
# as before 1.7. Not recommended.
#allowPrivateDestinations = false
# With a JVM outbound proxy (http.proxyHost / https.proxyHost), requests to hosts outside
# http.nonProxyHosts go through it. The outbound proxy resolves the final target, so a
# destination is checked here only when its name resolves locally. Set to false to refuse
# those requests instead.
#allowForwardProxy = true

# Content types accepted from the remote host when checkResponseContentType = true (default
# false). Proxied responses are always served with a sandboxing Content-Security-Policy and
# nosniff; enable the check only with a list that names every type your services return.
#checkResponseContentType = false
mimetypeWhitelist = application/force-download,text/html,text/plain,application/xml,text/xml,application/vnd.ogc.sld+xml,application/vnd.ogc.gml,application/json,application/vnd.ogc.wms_xml,application/x-www-form-urlencoded

methodsWhitelist = GET,POST,PUT

#hostsWhitelist = 127.0.0.1

# Optional: only forward these request headers (comma-separated, case-insensitive).
# If empty or commented out, all headers are forwarded (except those in the blacklist).
#requestHeaderWhitelist = Accept,Accept-Language,Content-Type,Authorization,Host

# Optional: never forward these request headers (comma-separated, case-insensitive).
# Blacklist takes precedence over whitelist.
# Defaults to Cookie: the browser's cookies belong to this application, not to the remote host.
# An empty value forwards every header.
#requestHeaderBlacklist = Cookie,X-Custom-Secret

# Response headers from the remote host that are never passed back to the client
# (comma-separated, case-insensitive). Each default one would change state the browser keeps
# for this application's origin. An empty value passes every header through.
#responseHeaderBlacklist = Set-Cookie,Set-Cookie2,Clear-Site-Data,Strict-Transport-Security

#reqtypeWhitelist.capabilities = (([&]?([Rr][Ee][Qq][Uu][Ee][Ss][Tt]=[Gg]et[Cc]apabilities))|([&]?(version=1\\.1\\.1)))+
reqtypeWhitelist.capabilities = .*[Gg]et[Cc]apabilities.*
reqtypeWhitelist.featureinfo = .*[Gg]et[Ff]eature[Ii]nfo.*
reqtypeWhitelist.csw = .*csw.*
reqtypeWhitelist.geostore = .*geostore.*
reqtypeWhitelist.generic = (.*exist.*)|(.*servicebox.*)|(.*pdf.*)|(.*map.*)|(.*ows.*)
