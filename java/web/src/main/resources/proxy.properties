# ##################
# CONNECTION MANAGER
# ##################
timeout = 30000
connection_timeout = 30000
max_total_connections = 60
default_max_connections_per_host = 6

# #################
# Stream Byte Size
# #################
defaultStreamByteSize=1024

# ###########
# WHITE LISTS
# ###########
# Hosts the proxy can reach (comma-separated host names). The proxy is disabled until you
# replace none.invalid with the hosts of your services, e.g.
#hostnameWhitelist = demo1.geo-solutions.it,gs-stable.geosolutionsgroup.com
# An empty value lets the proxy reach any public host. Not recommended.
hostnameWhitelist = none.invalid

# Non-public destinations (private networks, loopback, link-local) are denied. Add only
# trusted internal services. Changes to the destination settings take effect after a restart.
#allowedPrivateHosts = geoserver.intranet.local,10.0.5.20:8080
#allowedPrivateNetworks = 10.0.5.0/24
# Set to true to switch the destination checks off. Not recommended.
#allowPrivateDestinations = false

# With a JVM outbound proxy (http.proxyHost / https.proxyHost), requests to hosts outside
# http.nonProxyHosts go through it. Set to true to allow them: the outbound proxy resolves
# the final target, so a destination is checked here only when its name resolves locally.
allowForwardProxy = false

# Set to true to refuse remote responses whose content type is not in mimetypeWhitelist.
# Proxied responses are always served with a sandboxing Content-Security-Policy and nosniff.
#checkResponseContentType = false

mimetypeWhitelist = application/force-download,text/html,text/plain,application/xml,text/xml,application/vnd.ogc.sld+xml,application/vnd.ogc.gml,application/json,application/vnd.ogc.wms_xml,application/x-www-form-urlencoded,image/png,application/pdf,text/csv,image/bil,application/bil16,application/zip,text/csv;charset=UTF-8,application/gml+xml,application/octet-stream,binary/octet-stream

methodsWhitelist = GET,POST,PUT

#hostsWhitelist = 127.0.0.1

# Request headers never forwarded to the remote host (comma-separated, case-insensitive).
# Defaults to Cookie: the browser's cookies belong to MapStore, not to the remote host.
#requestHeaderBlacklist = Cookie
# Response headers from the remote host never passed back to the browser. Defaults to:
#responseHeaderBlacklist = Set-Cookie,Set-Cookie2,Clear-Site-Data,Strict-Transport-Security

#reqtypeWhitelist.capabilities = (([&]?([Rr][Ee][Qq][Uu][Ee][Ss][Tt]=[Gg]et[Cc]apabilities))|([&]?(version=1\\.1\\.1)))+
reqtypeWhitelist.capabilities = .*[Gg]et[Cc]apabilities.*
reqtypeWhitelist.featureinfo = .*[Gg]et[Ff]eature[Ii]nfo.*
reqtypeWhitelist.csw = .*csw.*
reqtypeWhitelist.geostore = .*geostore.*
reqtypeWhitelist.generic = (.*exist.*)|(.*pdf.*)|(.*map.*)|(.*wms.*)|(.*wmts.*)|(.*tms.*)|(.*wfs.*)|(.*ows.*)|(.*spatialreference.*)|(.*wps.*)|(.*rest.*)|(.*tileset\.json.*)|(.*\.b3dm.*)|(.*\.i3dm.*)|(.*\.pnts.*)|(.*\.glb.*)|(.*\.ifc.*)
